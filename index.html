<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Lokebox Quote, a visual quote builder</title>
    <meta name="description" content="Your customer configures the product, sees it in 3D and gets an estimate. You get the request with every detail already filled in." />

    <!-- Open Graph: la tarjeta que arma WhatsApp o LinkedIn cuando se pega el link.
         La imagen es la demo EN andando, generada con `node scripts/og.mjs`, y las URL
         van absolutas porque el que las lee no es el navegador del visitante. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lokebox Quote" />
    <meta property="og:url" content="https://quote.lokebox.com/" />
    <meta property="og:title" content="Lokebox Quote, a visual quote builder" />
    <meta property="og:description" content="Your customer configures the product, sees it in 3D and gets an estimate. You get the request with every detail already filled in." />
    <meta property="og:image" content="https://quote.lokebox.com/og-lokebox-quote.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sign quote builder with a 3D preview, the options panel and the estimated price." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
